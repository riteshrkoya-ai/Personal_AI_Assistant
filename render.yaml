databases:
  - name: personal-ai-assistant-db
    plan: free
    region: virginia

services:
  - type: web
    name: personal-ai-assistant-api
    runtime: docker
    plan: free
    region: virginia
    branch: feature/render-deploy-safe
    healthCheckPath: /health

    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000

    envVars:
      - key: APP_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: personal-ai-assistant-db
          property: connectionString

      - key: LLM_MODEL
        value: gemini/gemini-3.6-flash

      - key: GEMINI_API_KEY
        sync: false

      - key: EMBEDDING_BACKEND
        value: fastembed

      - key: TIMEZONE
        value: America/New_York

      - key: TELEGRAM_MODE
        value: webhook

      - key: TELEGRAM_WEBHOOK_URL
        value: https://personal-ai-assistant-api-tns7.onrender.com/telegram/webhook

      - key: API_BASE_URL
        value: http://127.0.0.1:10000

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      - key: AUTHORIZED_TELEGRAM_CHAT_IDS
        sync: false