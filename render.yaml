databases:
  - name: personal-ai-assistant-db
    plan: free

services:
  - type: web
    name: personal-ai-assistant
    env: docker
    plan: free
    branch: feature/phase10-render-deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-ai-assistant-db
          property: connectionString
      - key: LLM_MODEL
        value: groq/llama-3.3-70b-versatile
      - key: RUN_BOT_IN_APP
        value: "1"
      - key: TIMEZONE
        value: America/New_York
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUTHORIZED_TELEGRAM_CHAT_IDS
        sync: false
